[project]
name = "exolot"
version = "0.1.0"
description = "Analyze code locally from the command line with the SonarQube for IDE language server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/skissane/exolot"

[project.scripts]
exolot = "exolot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "diff-cover>=11.0.0",
    "jactionlint>=2.4.0",
    "jsonschema>=4.23",
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "types-jsonschema>=4.26.0.20261006",
]

# The policy at the top of the self-analysis PR comment (see AGENTS.md).
[tool.exolot]
preamble = """
**For information only.** Fix the findings worth fixing; it's fine to ignore the rest, which don't block the PR, \
and there's no need to suppress them with a rules file, `NOSONAR` or `noqa`. \
See [AGENTS.md](https://github.com/skissane/exolot/blob/master/AGENTS.md) for more.
"""

# Refuse uv versions older than CI's, which may resolve or write uv.lock differently.
# Keep in step with the setup-uv `version` in .github/workflows.
[tool.uv]
required-version = ">=0.13.6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLC0415", "RUF100"]

[tool.mypy]
files = ["src", "scripts", "tests"]
strict = true
# Resolve `exolot` to src rather than the editable install, which has no py.typed
# (so mypy would treat it as untyped), and `scripts`/`tests` from the repo root.
mypy_path = "src"
explicit_package_bases = true

# Tests are type-checked, but needn't annotate every test function and fixture.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# The repo root, so tests can import the stdlib-only CI scripts in scripts/.
[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["exolot", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"
