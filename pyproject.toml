[project]
name = "exolot"
version = "0.6.0"
description = "Analyze code locally from the command line with the SonarQube for IDE language server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/skissane/exolot"

[project.scripts]
exolot = "exolot.cli:main"

[build-system]
# repoutils provides the build hook below. uv.lock doesn't lock build
# requirements, so it's pinned here by version.
requires = ["hatchling", "repoutils==0.5.2"]
build-backend = "hatchling.build"

# Records the commit a build comes from in the sdist and the wheel, for
# `exolot --version` (src/exolot/build_info.py reads it).
[tool.hatch.build.hooks.repoutils-build-info]
file = "src/exolot/build_info.json"

[dependency-groups]
# Repository checks and CI helpers (see AGENTS.md). Its own group, so CI jobs
# that hold a write-capable token can install it alone, hash-checked against
# uv.lock, with `uv run --only-group repoutils`.
repoutils = ["repoutils>=0.5.2"]
dev = [
    { include-group = "repoutils" },
    "coverage>=7.17.3",
    "diff-cover>=11.0.2",
    "jactionlint>=2.6.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
]

# The policy at the top of the self-analysis PR comment (see AGENTS.md).
[tool.exolot]
preamble = """
**For information only.** Fix the findings worth fixing; it's fine to ignore the rest, which don't block the PR, \
and there's no need to suppress them with a rules file, `NOSONAR` or `noqa`. \
See [AGENTS.md](https://github.com/skissane/exolot/blob/master/AGENTS.md) for more.
"""

# Settings for repoutils' commands (see AGENTS.md). The comment prefix keeps
# the markers the PR comments had before repoutils, e.g.
# <!-- exolot-patch-coverage -->, so they're still found and edited.
[tool.repoutils]
comment-prefix = "exolot"
default-branch = "master"
# The optional repoutils features exolot uses, which decide the standard
# justfile recipes `just check-justfile` asks for.
features = ["pypi-publication"]

# The standard justfile recipes and dependencies exolot leaves out on purpose.
# `check` leaves out `pyright` (see AGENTS.md), and `prose-check`, as AGENTS.md
# and README.md don't pass it yet.
[tool.repoutils.justfile]
omit-dependencies = { check = ["pyright", "prose-check"] }

# The platforms uv.lock may have wheels for, matching [tool.uv] environments.
# "os" allows any arch, and "os:arch" one; "linux" matches manylinux and musllinux.
[tool.repoutils.lock-platforms]
supported = ["any", "linux:x86_64", "linux:aarch64", "macosx", "win:amd64"]

# The Markdown files `just sentence-per-line-check` keeps one sentence per line.
# README.md is left out until it's reflowed from its fixed-width wrapping.
[tool.repoutils.sentence-per-line]
files = ["AGENTS.md"]

# The files `just long-files` lists as over the line limit (see AGENTS.md).
[tool.repoutils.long-files]
include = ["*.py"]
limit = 500

# The suppression comments `just added-strings` points out when a PR adds them
# (see AGENTS.md). Regexes rather than plain strings, so that only a comment
# matches, not a string literal or test data naming one: only whole string
# literals (triple-quoted ones on one line too) come before the #, matched
# possessively so a string isn't reread as shorter ones around a #, and the
# comment can follow an earlier one, as in `# type: ignore # noqa`
# (tests/test_added_strings.py checks them).
[tool.repoutils.added-strings]
include = ["*.py"]

[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*(?i:nosonar)\b'''
name = "NOSONAR"
message = "AGENTS.md asks not to suppress exolot's findings: fix the code, or leave the finding as it is"

# ruff reads noqa case-insensitively, and a bare one too.
[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*(?i:noqa)\b'''
name = "# noqa"
message = "AGENTS.md asks not to suppress exolot's findings, and a ruff finding is better fixed than suppressed, where you can"

[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*type:\s*ignore\b'''
name = "# type: ignore"
message = "please fix the type error instead, if you can"

# The sonarlint-vscode release exolot downloads by default, and its assets'
# digests, which `repoutils github-releases bump` writes to upstream.toml and
# bump-sonarlint-vscode.yml runs daily. One pattern per asset exolot downloads
# (server.asset_name), so a release that drops one fails to bump rather than
# pinning fewer.
[tool.repoutils.github-releases.sonarlint-vscode]
repo = "SonarSource/sonarlint-vscode"
file = "src/exolot/upstream.toml"
assets = [
    "sonarlint-vscode-[0-9]*.vsix",
    "sonarlint-vscode-darwin-arm64-*.vsix",
    "sonarlint-vscode-darwin-x64-*.vsix",
    "sonarlint-vscode-linux-x64-*.vsix",
    "sonarlint-vscode-win32-x64-*.vsix",
]
cooldown-days = 7

# The secrets the workflows use, which `just secrets-workflows-check` checks,
# and `just github-settings-check` checks the repository has.
[tool.repoutils.secrets]
actions = ["CLAUDE_CODE_OAUTH_TOKEN"]
# build.yml's dependabot-push job pushes re-locked uv.lock commits to
# Dependabot's branches with this; only Dependabot's runs can read it.
dependabot = ["DEPENDABOT_FIX_TOKEN"]
# Only master's workflows can reach these: build.yml's release job pushes v*
# tags with the deploy key, and bump-version.yml and bump-sonarlint-vscode.yml
# open PRs with GH_ACTIONS_TOKEN.
environments.release = ["GH_ACTIONS_TOKEN", "RELEASE_DEPLOY_KEY"]
# fix-push.yml pushes /autofix's commits to a PR's branch with this.
environments.autofix = ["AUTOFIX_TOKEN"]

# The GitHub settings below are what `just github-settings-check` checks and
# `just github-settings-ensure` applies (see AGENTS.md's Releases section).
# Both need a token with administration access, which CI doesn't have.

# The repository settings `repoutils repo-settings` checks or changes.
[tool.repoutils.repo-settings]
issues = true
projects = true
wiki = true
discussions = false
pull-requests = true
pull-request-creation = "collaborators"
merge-commit = { allow = false }
squash-merge = { allow = true, title = "pr-title", message = "blank" }
rebase-merge = { allow = false }
allow-auto-merge = true
allow-update-branch = true
delete-branch-on-merge = true
require-web-commit-signoff = false

# The security settings `repoutils security-settings` checks or changes.
# Immutable releases stop a published release's assets and tag from changing,
# alongside the v* tag rulesets.
# CodeQL default setup raises code scanning alerts, which we dismiss where
# they don't apply. Its CodeQL check fails on a new alert of high or higher
# severity, but no ruleset requires that check.
[tool.repoutils.security-settings]
private-vulnerability-reporting = false
dependabot-security-updates = true
codeql-default-setup = true
secret-protection = true
push-protection = true
immutable-releases = true

# The deployment environments `repoutils environments` checks or creates.
# Only master can deploy to release, which holds the secrets that can tag a
# release or push a branch (build.yml's release job, bump-version.yml and
# bump-sonarlint-vscode.yml), so a branch's own copy of a workflow can't read
# them.
[tool.repoutils.environments.release]
deployment-branches = "selected"
allowed-branches = ["master"]
allowed-tags = []

# Only master can deploy to autofix either, which holds AUTOFIX_TOKEN for
# fix-push.yml. It's apart from release, so the job that pushes a PR's
# branch can't read the release deploy key.
[tool.repoutils.environments.autofix]
deployment-branches = "selected"
allowed-branches = ["master"]
allowed-tags = []

# publish-pypi.yml's environments. Only a v* tag (a release) may deploy to
# pypi, and only once Simon approves, so a run of a PR branch's copy of the
# workflow (which /testpypi dispatches) can't publish to PyPI through trusted
# publishing; testpypi stays open for /testpypi.
[tool.repoutils.environments.pypi]
deployment-branches = "selected"
allowed-branches = []
allowed-tags = ["v*"]
reviewers = ["skissane"]
prevent-self-review = false
can-admins-bypass = false

[tool.repoutils.environments.testpypi]
deployment-branches = "all"

# The deploy keys `repoutils deploy-keys` checks or creates. build.yml's
# release job pushes v* tags with release's private half, which only the
# release environment holds; the release-tags-create ruleset lets only deploy
# keys create a v* tag, so this must stay the only write-capable one.
[tool.repoutils.deploy-keys.release]
write = true
secret = { environment = "release", name = "RELEASE_DEPLOY_KEY" }

# The rulesets `repoutils rulesets` checks or creates, each giving only what
# differs from a new ruleset's defaults. master changes only by a squash-merged
# PR whose check-and-build passed, which stands in for the rest of build.yml's
# gating jobs (it isn't named build, as attestations.yml has a build job).
[tool.repoutils.rulesets.main]
include = ["~DEFAULT_BRANCH"]

[tool.repoutils.rulesets.main.rules]
deletion = true
non-fast-forward = true

[tool.repoutils.rulesets.main.rules.pull-request]
allowed-merge-methods = ["squash"]

[tool.repoutils.rulesets.main.rules.required-status-checks]
# "Require branches to be up to date before merging", so a PR's checks ran against what it merges into.
strict-required-status-checks-policy = true
required-status-checks = [
    { context = "check-and-build", app = "github-actions" },
]

# Release tags. Nobody can move or delete a v* tag, admins included: a faulty
# release is fixed by a new one. Only deploy keys can create one, which is how
# build.yml's release job tags a release. They're two rulesets because a
# bypass covers every rule in its ruleset.
[tool.repoutils.rulesets.release-tags-immutable]
target = "tag"
include = ["v*"]

[tool.repoutils.rulesets.release-tags-immutable.rules]
update = true
deletion = true

[tool.repoutils.rulesets.release-tags-create]
target = "tag"
include = ["v*"]
bypass = [{ deploy-keys = true }]

[tool.repoutils.rulesets.release-tags-create.rules]
creation = true

# The issue and PR labels `repoutils labels` checks or creates (see AGENTS.md's
# Issue labels); .github/dependabot.yml applies two.
[[tool.repoutils.labels]]
name = "type:bug"
color = "d73a4a"
description = "Something behaves wrongly"

[[tool.repoutils.labels]]
name = "type:feature"
color = "0e5a8a"
description = "New capability"

[[tool.repoutils.labels]]
name = "type:improvement"
color = "1d76db"
description = "Makes something that already works better"

[[tool.repoutils.labels]]
name = "type:maintenance"
color = "5319e7"
description = "Refactors, dead code, CI, dependencies; no visible change"

[[tool.repoutils.labels]]
name = "type:docs"
color = "0075ca"
description = "Documentation only"

[[tool.repoutils.labels]]
name = "priority:p0"
color = "b60205"
description = "Drop everything: a release is broken or reports wrong results"

[[tool.repoutils.labels]]
name = "priority:p1"
color = "e99695"
description = "Do next"

[[tool.repoutils.labels]]
name = "priority:p2"
color = "f9d0c4"
description = "Worth doing when convenient"

[[tool.repoutils.labels]]
name = "priority:p3"
color = "ededed"
description = "Someday/maybe"

[[tool.repoutils.labels]]
name = "size:s"
color = "c2e0c6"
description = "One small PR"

[[tool.repoutils.labels]]
name = "size:m"
color = "7fd18b"
description = "One PR that needs some design"

[[tool.repoutils.labels]]
name = "size:l"
color = "0e8a16"
description = "Several PRs: should become a parent issue with sub-issues"

[[tool.repoutils.labels]]
name = "concern:security"
color = "fbca04"
description = "Security risk or hardening"

[[tool.repoutils.labels]]
name = "concern:upstream"
color = "c5def5"
description = "Depends on SonarSource VSIX or language server behaviour"

[[tool.repoutils.labels]]
name = "concern:platform"
color = "bfd4f2"
description = "Specific to an OS or architecture"

[[tool.repoutils.labels]]
name = "concern:breaking"
color = "e4a11b"
description = "Changes CLI flags, output or exit codes that scripts rely on"

[[tool.repoutils.labels]]
name = "question"
color = "d876e3"
description = "Further information is requested"

[[tool.repoutils.labels]]
name = "dependencies"
color = "0366d6"
description = "Dependabot's dependency updates"

# Refuse uv versions older than CI's, which may resolve or write uv.lock differently.
# Keep in step with the setup-uv `version` in .github/workflows.
[tool.uv]
required-version = ">=0.13.6"
# Development (the dev group's wheels in uv.lock) is supported where CI runs:
# macOS, Linux x86_64/aarch64 and Windows x86_64. exolot itself is pure Python.
# `just lock-platforms-check` checks uv.lock keeps to these.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLC0415", "RUF100"]

[tool.mypy]
files = ["src", "tests"]
strict = true
# Resolve `exolot` to src rather than the editable install, which has no py.typed
# (so mypy would treat it as untyped), and `tests` from the repo root.
mypy_path = "src"
explicit_package_bases = true
# Beyond --strict, to come closer to pyright's strict mode (see [tool.pyright]):
# pyright reports unnecessary isinstance checks and comparisons, possibly unbound
# names, deprecated APIs and non-exhaustive matches, all off by default in mypy.
# Explicit Any stays allowed, as pyright's strict mode only rejects implicit Any.
warn_unreachable = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    # Matches pyright's reportImplicitOverride.
    "explicit-override",
]

# Tests are relaxed, as for pyright: pytest.mark.parametrize leaves a test that
# takes an Any-typed parameter untyped after decoration.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_decorated = false

# The repo root, so tests can import each other as tests.<module>.
[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error"]
addopts = "-n auto"

[tool.coverage.run]
source = ["exolot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Not part of strict; matches mypy's explicit-override error code.
reportImplicitOverride = "error"
extraPaths = ["src"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportPrivateUsage = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
