[project]
name = "exolot"
version = "0.1.0"
description = "Analyze code locally from the command line with the SonarQube for IDE language server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/skissane/exolot"

[project.scripts]
exolot = "exolot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "diff-cover>=11.0.0",
    "jactionlint>=2.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLC0415", "RUF100"]

[tool.coverage.run]
source = ["exolot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"
