[project]
name = "exolot"
version = "0.5.0"
description = "Analyze code locally from the command line with the SonarQube for IDE language server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/skissane/exolot"

[project.scripts]
exolot = "exolot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "diff-cover>=11.0.0",
    "jactionlint>=2.4.0",
    "jsonschema>=4.23",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
    "types-jsonschema>=4.26.0.20261006",
]

# The policy at the top of the self-analysis PR comment (see AGENTS.md).
[tool.exolot]
preamble = """
**For information only.** Fix the findings worth fixing; it's fine to ignore the rest, which don't block the PR, \
and there's no need to suppress them with a rules file, `NOSONAR` or `noqa`. \
See [AGENTS.md](https://github.com/skissane/exolot/blob/master/AGENTS.md) for more.
"""

# Refuse uv versions older than CI's, which may resolve or write uv.lock differently.
# Keep in step with the setup-uv `version` in .github/workflows.
[tool.uv]
required-version = ">=0.13.6"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLC0415", "RUF100"]

[tool.mypy]
files = ["src", "scripts", "tests"]
strict = true
# Resolve `exolot` to src rather than the editable install, which has no py.typed
# (so mypy would treat it as untyped), and `scripts`/`tests` from the repo root.
mypy_path = "src"
explicit_package_bases = true
# Beyond --strict, to come closer to pyright's strict mode (see [tool.pyright]):
# pyright reports unnecessary isinstance checks and comparisons, possibly unbound
# names, deprecated APIs and non-exhaustive matches, all off by default in mypy.
# Explicit Any stays allowed, as pyright's strict mode only rejects implicit Any.
warn_unreachable = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    # Matches pyright's reportImplicitOverride.
    "explicit-override",
]

# Tests are relaxed, as for pyright: pytest.mark.parametrize leaves a test that
# takes an Any-typed parameter untyped after decoration.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_decorated = false

# The repo root, so tests can import the stdlib-only CI scripts in scripts/.
[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["error"]
addopts = "-n auto"

[tool.coverage.run]
source = ["exolot", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Not part of strict; matches mypy's explicit-override error code.
reportImplicitOverride = "error"
extraPaths = ["src"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportPrivateUsage = false
reportUnknownLambdaType = false
reportUnknownArgumentType = false
