name: Prepare publish
description: >-
  Installs uv and just, downloads the build job's dist artifact into dist/,
  signs a PEP 740 publish attestation for each file in it with attest-action,
  and checks every file has one, ready for uv publish.

# The publish jobs in publish-pypi.yml run this after their own
# actions/checkout (which has to come first, as this action lives in the
# checkout) and before uv publish, and the Attestations workflow
# (attestations.yml) runs it to check on PRs that attesting still works.
#
# A composite action's steps run inside the calling job, unlike a reusable
# workflow's, so attest-action signs with the calling workflow's identity:
# the OIDC token's workflow_ref is still publish-pypi.yml, which the trusted
# publishers name. The calling job needs id-token: write.
runs:
  using: composite
  steps:
    # Keep version in step with pyproject.toml's [tool.uv] required-version.
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"

    # Keep just-version in step with the justfile's minimum-version.
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.58.0"

    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    # Signs a PEP 740 publish attestation for each file in dist/ with the
    # calling workflow's identity (the trusted publisher), which uv publish
    # uploads alongside it; the index shows them as the release's provenance.
    - name: Generate attestations
      uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

    # uv publish uploads without attestations if they're missing, so stop
    # here rather than publish a release with no provenance.
    - name: Check every distribution has an attestation
      shell: bash
      run: just check-attestations
