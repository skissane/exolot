name: Install gh-actions-lock
description: >-
  Installs the github/gh-actions-lock gh extension from its release binary,
  checked against its SHA-256, so `gh actions-lock` runs.

# build.yml's check-and-build job runs this so `just check` can verify
# actions.lock, and fix.yml's fix job runs it so `just fix` can regenerate it,
# so the version and its hash live in one place. `gh extension install --pin`
# takes only a release tag for a precompiled extension, so a moved tag or a
# replaced asset could swap it.
# Instead this installs the checked binary as a local extension, from a
# directory named after it.
runs:
  using: composite
  steps:
    - name: Install gh-actions-lock
      shell: bash
      env:
        GH_ACTIONS_LOCK_VERSION: v0.4.1
        GH_ACTIONS_LOCK_SHA256: 39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e
      run: |
        dir="$RUNNER_TEMP/gh-actions-lock"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/gh-actions-lock" \
          "https://github.com/github/gh-actions-lock/releases/download/$GH_ACTIONS_LOCK_VERSION/linux-amd64"
        echo "$GH_ACTIONS_LOCK_SHA256  $dir/gh-actions-lock" | sha256sum --check --strict
        chmod +x "$dir/gh-actions-lock"
        cd "$dir"
        gh extension install .
