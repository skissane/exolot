# Workflows and local actions name actions by version tag, and
# .github/workflows/actions.lock pins each to a commit; Dependabot updates both
# together. The cooldown skips releases younger than a week, so a
# compromised release has time to be noticed and pulled before it lands here.
version: 2
updates:
  # "/" covers .github/workflows; the local composite actions in
  # .github/actions need listing too, as Dependabot reads only the action.yml
  # of each directory listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - type:maintenance

  # exolot has no runtime dependencies, so this updates the dev group, in one PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns:
          - "*"
    labels:
      - dependencies
      - type:maintenance
