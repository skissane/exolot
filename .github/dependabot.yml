# Workflows pin actions to commit SHAs with a version comment, which Dependabot
# updates together. The cooldown skips releases younger than a week, so a
# compromised release has time to be noticed and pulled before it lands here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - type:maintenance

  # exolot has no runtime dependencies, so this updates the dev group, in one PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns:
          - "*"
    labels:
      - dependencies
      - type:maintenance
