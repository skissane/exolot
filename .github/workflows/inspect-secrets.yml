name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and the start of its SHA-256 hash, and each
# SSH key's fingerprint, so it can be matched to its row on GitHub's settings
# pages. It never shows a value. It fails if GitHub rejects a token, or it
# expires within 14 days, and warns about any secret a job gets that
# pyproject.toml doesn't list for it. Dependabot secrets can't be inspected, as
# only Dependabot's runs get them.
#
# Run it by hand from master, or with `just inspect-secrets` (see AGENTS.md).
# Each job's `if` skips it on other branches, but a branch can edit that: only
# the release and autofix jobs' secrets are kept from other branches, by their
# environments, as for any workflow that uses secrets. The summary is as public
# as the run's logs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  repository:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only what `uv run --only-group repoutils` needs: it installs just
      # repoutils, hash-checked against uv.lock, and not exolot.
      - name: Checkout pyproject.toml and uv.lock
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      # No cache, so nothing a cache entry holds runs alongside the secrets.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Inspect the repository's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          uv run --only-group repoutils repoutils secrets inspect

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout pyproject.toml and uv.lock
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      # No cache, so nothing a cache entry holds runs alongside the secrets.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Inspect the release environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          uv run --only-group repoutils repoutils secrets inspect --environment release

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  autofix:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: autofix
    permissions:
      contents: read
    steps:
      - name: Checkout pyproject.toml and uv.lock
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      # No cache, so nothing a cache entry holds runs alongside the secrets.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Inspect the autofix environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          uv run --only-group repoutils repoutils secrets inspect --environment autofix

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore
