name: TestPyPI comment

# A PR comment from the repo owner that is just "/testpypi" (whitespace aside)
# starts a manual run of the Publish workflow (publish-pypi.yml) on the PR's
# head branch. That is the same as Actions > Publish > Run workflow on that
# branch: it publishes a dev version of the branch to TestPyPI, checks it
# installs from there, and never reaches the PyPI jobs.
#
# issue_comment workflows always run master's copy of this file, so a change
# to it only takes effect once merged.
#
# The testpypi-dispatch action does the work, with `repoutils testpypi`. It
# runs no code from the PR's branch, and this job has no id-token. A dispatch
# sent with GITHUB_TOKEN does start a run (one of the exceptions to "events
# from GITHUB_TOKEN don't trigger workflows"), and the TestPyPI trusted
# publisher trusts publish-pypi.yml and its testpypi environment, not who
# dispatched it. Because a comment can cause a publish, only comments from the
# owner (or, in an organization, its members) count, and closed PRs and PRs
# from forks are refused (a fork's branch isn't in this repo, so it can't be
# dispatched anyway).
on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    # A cheap pre-filter; testpypi-dispatch checks the exact match, as
    # expressions can't trim whitespace.
    # OWNER is a user-owned repository's owner; in an organization's
    # repository its members, owners included, are MEMBER.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/testpypi')
    runs-on: ubuntu-latest
    permissions:
      actions: write # Dispatch publish-pypi.yml
      pull-requests: write # React to the comment and reply with the run's link
    steps:
      - name: Start the Publish workflow on the PR's branch
        uses: sjktools/repoutils/.github/actions/testpypi-dispatch@v0.5.4
        with:
          pr: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          comment-body: ${{ github.event.comment.body }}

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore
