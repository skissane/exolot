name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # GH_ACTIONS_TOKEN is in the release environment, which only master can
    # deploy to, so run this workflow from master.
    environment: release
    # GH_ACTIONS_TOKEN does the writing.
    permissions:
      contents: read

    steps:
      # Runs repoutils from this commit with the runner's python3, installing
      # nothing, so nothing from a cache runs alongside GH_ACTIONS_TOKEN.
      - name: Open the version bump pull request
        uses: sjktools/repoutils/.github/actions/bump-version@v0.5.1
        with:
          bump: ${{ inputs.bump }}
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          auto-merge: squash
