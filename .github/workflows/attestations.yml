name: Attestations

# Checks on PRs that the publish jobs in publish-pypi.yml can still attest a
# build, so a change that breaks it (an attest-action bump, an edit to the
# publish workflow or the build settings) shows up before a release rather
# than during one. It builds, signs PEP 740 publish attestations with
# attest-action and runs the same check the publish jobs do, then stops: it
# never uploads, and neither index's trusted publisher names this workflow
# file, so its token can't publish anyway. Sigstore signs for any GitHub OIDC
# identity, so this tests everything but the upload. Each run adds an entry to
# Sigstore's public transparency log.
#
# Keep its steps in step with publish-pypi.yml's build and publish jobs.
on:
  pull_request:
    paths:
      - .github/workflows/attestations.yml
      - .github/workflows/publish-*.yml
      - pyproject.toml
      - justfile
      - scripts/check_attestations.py
  workflow_dispatch:

# A new push to the PR cancels the run for the one before, so a superseded
# commit doesn't go on to sign (and add a transparency log entry). Set on the
# workflow so a cancelled run's attest job is cancelled too; a manual run gets
# a group of its own, so it never cancels or waits for another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('attestations.yml-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Builds without id-token: write, as publish-pypi.yml's build job does, so
  # the build steps (and the build backend they install) can't mint a token.
  # That keeps only the build away from it: the attest job still runs the PR's
  # justfile and check script with the token, and a same-repo PR can edit this
  # workflow anyway, so the split isn't a boundary against the PR's author.
  build:
    # A fork PR's run gets no OIDC token, so attest-action can't sign there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Build package
        run: just build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          overwrite: true

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Check every distribution has an attestation
        run: just check-attestations
