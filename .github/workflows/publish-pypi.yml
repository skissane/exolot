name: Publish to PyPI

# Publishes only from a v* tag. A manual run (e.g. to retry a failed publish)
# must be started on the release's tag; on a branch it fails before building.
# For a test release of a branch, run "Publish to TestPyPI" instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exolot
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - name: Check tag matches version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Publishing to PyPI needs a v* tag, not the ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          VERSION="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --verbose

  # Checks the release installs from PyPI and runs, as users get it with uvx.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Check release installs from PyPI
        run: just check-release "$(uv version --short)"
