name: PR Fixes on comment

# A PR comment from the repo owner (or, in an organization, a member) that is
# just `/autofix` (whitespace aside) runs the PR Fixes workflow (fix.yml) on the
# PR's branch, as running it by hand would. This runs no code from the branch.
# The dispatched run is the branch's copy of fix.yml, which holds no secrets;
# master's copy of fix-push.yml checks what it made before pushing it.
#
# The autofix-start action does the work, with `repoutils autofix`: it waits
# for the fix run to finish and then dispatches fix-push.yml on master itself. A
# run dispatched with a GITHUB_TOKEN starts no workflow_run workflow when it
# completes, so fix-push.yml's own trigger never fires for it. If fix-push.yml
# doesn't report on the PR, the action does.
on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    # A cheap pre-filter; autofix-start checks the exact match, as expressions
    # can't trim whitespace.
    # OWNER is a user-owned repository's owner; in an organization's
    # repository its members, owners included, are MEMBER.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/autofix')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    # autofix-start gives up after 40 minutes, before this, so its report
    # still runs: a job that times out is cancelled, and runs no failure() steps.
    timeout-minutes: 45

    steps:
      # Only for [tool.repoutils]'s comment-prefix, which the report's marker uses.
      - name: Checkout pyproject.toml
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Run PR Fixes and push its fixes
        uses: sjktools/repoutils/.github/actions/autofix-start@v0.5.0
        with:
          pr: ${{ github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          comment-body: ${{ github.event.comment.body }}
