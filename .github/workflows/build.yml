name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Unit tests on every supported Python version and OS. uv installs the
  # matrix's Python, which overrides .python-version.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Run tests
        run: just test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Install dependencies
        run: just sync

      - name: Run checks
        run: just check

      - name: Build package
        run: just build

      - name: Smoke-test the wheel
        run: just smoke

  # End-to-end test against the real language server, on each kind of VSIX:
  # the platform builds with a bundled JRE (linux-x64, darwin-arm64,
  # win32-x64), and the universal build with the runner's Java (linux-arm64).
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-24.04-arm
            java: "21"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      EXOLOT_CACHE_DIR: ${{ github.workspace }}/.exolot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install Java
        if: matrix.java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install dependencies
        run: just sync

      - name: Get pinned server version
        id: server
        shell: bash
        run: |
          echo "version=$(uv run --no-sync python -c 'from exolot.server import DEFAULT_SERVER_VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"

      # The unpacked server is about 300 MB, and is only ever replaced by
      # changing the pinned version, so cache it rather than download the VSIX
      # on every run.
      - name: Cache language server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .exolot-cache/servers
          key: exolot-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.server.outputs.version }}

      - name: Run integration tests
        run: just integration

  # Reports total coverage, and on PRs how much of the changed code the tests
  # cover, in the job summary (and, through post-patch-coverage, a PR comment),
  # and uploads coverage and test results to Codecov, whose codecov/project and
  # codecov/patch statuses check it against codecov.yml's thresholds (they
  # aren't required checks, so they report but don't block merging).
  # CODECOV_TOKEN is both an Actions and a Dependabot secret, so the uploads
  # work on Dependabot's PRs too.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For wait-for-base-coverage to read the base commit's check runs.
      checks: read
    outputs:
      # So post-patch-coverage posts the report even if a later step fails.
      patch-report: ${{ steps.patch-report.outcome }}

    steps:
      # Full history so diff-cover can find the merge base with the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Report coverage
        run: just coverage --cov-report="markdown-append:${GITHUB_STEP_SUMMARY}"

      # Codecov Test Analytics, from the junit.xml `just coverage` writes. Runs
      # even if the tests failed, as that's when the results matter most.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          disable_search: true

      - name: Report patch coverage
        if: github.event_name == 'pull_request'
        run: |
          just diff-cover "origin/${BASE_REF}" --format markdown:patch-coverage.md
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

      # For post-patch-coverage to post to the PR.
      - name: Upload patch coverage report
        id: patch-report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-coverage
          path: patch-coverage.md
          retention-days: 14

      # Codecov compares a PR with its base's report only when the PR's upload
      # is processed, and never again, so wait for the base's upload first (e.g.
      # when this PR was just brought up to date with master and master's run is
      # still going). It never fails the job, only warns, and is quick when the
      # base's CI has finished.
      - name: Wait for the PR base's coverage on Codecov
        if: github.event_name == 'pull_request'
        run: just wait-for-base-coverage "$GITHUB_REPOSITORY" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

  # Post the patch-coverage artifact (diff-cover's Markdown report) to the PR
  # as a github-actions[bot] comment, or edit the one posted before, so it's
  # seen without opening the coverage job's summary or Codecov. Runs whenever
  # the coverage job uploaded the report, even if a Codecov step then failed.
  # Only for PRs from this repo: on a fork's or Dependabot's PR, GITHUB_TOKEN
  # is read-only. Queued per PR, and posts only if HEAD_SHA is still the PR's
  # head, so an older commit's run that finishes last can't overwrite a newer
  # report. Needs no secrets, and installs nothing alongside its token: it runs
  # the PR's stdlib-only script with `uv run --no-project`.
  post-patch-coverage:
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.outputs.patch-report == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-patch-coverage-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download patch coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-coverage

      - name: Post patch coverage to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just patch-coverage-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]'

  # Runs exolot on its own code, for information only: --exit-zero, so its
  # findings never fail the job (only a failed analysis does). It reports them
  # in the job summary and, on PRs, through post-self-analysis as a PR comment,
  # with the ones on lines the PR changes first. See AGENTS.md for how to treat
  # them.
  self-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXOLOT_CACHE_DIR: ${{ github.workspace }}/.exolot-cache

    steps:
      # The PR's head rather than its merge with the base, so the findings'
      # line numbers and links match the PR's code. Full history so --diff-base
      # can find the lines the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Get pinned server version
        id: server
        run: |
          echo "version=$(uv run --no-sync python -c 'from exolot.server import DEFAULT_SERVER_VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"

      # Shares the integration job's cache entry on ubuntu-latest.
      - name: Cache language server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .exolot-cache/servers
          key: exolot-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.server.outputs.version }}

      # On PRs, --diff-base marks the findings on lines the PR changes. The
      # report links to the checked-out commit and this run, and starts with
      # the preamble in pyproject.toml's [tool.exolot].
      - name: Analyze exolot with itself
        run: |
          args=(--exit-zero --format github-comment)
          if [ -n "$BASE_REF" ]; then
            args+=(--diff-base "origin/${BASE_REF}")
          fi
          just self-analyze "${args[@]}" > self-analysis.md
          cat self-analysis.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

      # For post-self-analysis to post to the PR.
      - name: Upload report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-analysis
          path: self-analysis.md
          retention-days: 14

  # Posts the self-analysis job's report to the PR as a new github-actions[bot]
  # comment, and hides the ones earlier runs posted as outdated, as the Claude
  # self-tests do. The same conditions and precautions as post-patch-coverage:
  # only same-repo, non-Dependabot PRs; queued per PR; posts only if HEAD_SHA
  # is still the PR's head; runs only the PR's stdlib-only script, without
  # installing the project, beside its token.
  post-self-analysis:
    needs: self-analysis
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-self-analysis-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-analysis

      - name: Post report to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just self-analysis-post "$PR_NUMBER" self-analysis.md --commit "$HEAD_SHA"

  # Tagging and releasing need a write-capable token, so they run in their own
  # job, only for pushes to master, and never alongside pull request code.
  release:
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          # The tag push below uses the stored token.
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - name: Tag and release version
        run: |
          VERSION="$(uv version --short)"
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}"
          fi
          # Checked separately so a rerun creates the release if an earlier run
          # pushed the tag but failed to create it.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --title "Release ${TAG}" --generate-notes
            echo "Created GitHub release ${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
