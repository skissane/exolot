name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Unit tests on every supported Python version and OS. uv installs the
  # matrix's Python, which overrides .python-version.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Run tests
        run: just test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Install dependencies
        run: just sync

      - name: Run checks
        run: just check

      - name: Build package
        run: just build

      - name: Smoke-test the wheel
        run: just smoke

  # End-to-end test against the real language server, on each kind of VSIX:
  # the platform builds with a bundled JRE (linux-x64, darwin-arm64,
  # win32-x64), and the universal build with the runner's Java (linux-arm64).
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-24.04-arm
            java: "21"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      EXOLOT_CACHE_DIR: ${{ github.workspace }}/.exolot-cache

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install Java
        if: matrix.java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install dependencies
        run: just sync

      - name: Get pinned server version
        id: server
        shell: bash
        run: |
          echo "version=$(uv run --no-sync python -c 'from exolot.server import DEFAULT_SERVER_VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"

      # The unpacked server is about 300 MB, and is only ever replaced by
      # changing the pinned version, so cache it rather than download the VSIX
      # on every run.
      - name: Cache language server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .exolot-cache/servers
          key: exolot-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.server.outputs.version }}

      - name: Run integration tests
        run: just integration

  # Reports total coverage, and on PRs how much of the changed code the tests
  # cover, in the job summary (and, through post-patch-coverage, a PR comment). Informational only: there's no coverage
  # threshold, so it fails only if the tests or diff-cover do.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history so diff-cover can find the merge base with the PR's base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Report coverage
        run: just coverage --cov-report="markdown-append:${GITHUB_STEP_SUMMARY}"

      - name: Report patch coverage
        if: github.event_name == 'pull_request'
        run: |
          just diff-cover "origin/${BASE_REF}" --format markdown:patch-coverage.md
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

      # For post-patch-coverage to post to the PR.
      - name: Upload patch coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-coverage
          path: patch-coverage.md
          retention-days: 14

  # Post the patch-coverage artifact (diff-cover's Markdown report) to the PR
  # as a github-actions[bot] comment, or edit the one posted before, so it's
  # seen without opening the coverage job's summary. Only for PRs from this
  # repo: on a fork's or Dependabot's PR, GITHUB_TOKEN is read-only. Queued per
  # PR, and posts only if HEAD_SHA is still the PR's head, so an older commit's
  # run that finishes last can't overwrite a newer report. Needs no secrets,
  # and installs nothing alongside its token: it runs the PR's stdlib-only
  # script with `uv run --no-project`.
  post-patch-coverage:
    needs: coverage
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-patch-coverage-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download patch coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-coverage

      - name: Post patch coverage to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just patch-coverage-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]'

  # Tagging and releasing need a write-capable token, so they run in their own
  # job, only for pushes to master, and never alongside pull request code.
  release:
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"

      - name: Tag and release version
        run: |
          VERSION="$(uv version --short)"
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}"
          fi
          # Checked separately so a rerun creates the release if an earlier run
          # pushed the tag but failed to create it.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --title "Release ${TAG}" --generate-notes
            echo "Created GitHub release ${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
