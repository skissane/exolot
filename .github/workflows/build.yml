name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Unit tests on every supported Python version and OS. uv installs the
  # matrix's Python, which overrides .python-version.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Run tests
        run: just test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Install dependencies
        run: just sync

      - name: Run checks
        run: just check

      - name: Build package
        run: just build

  # Informational only: reports total coverage, and on PRs how much of the
  # changed code the tests cover, in the job summary. It never fails the build.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history so diff-cover can find the merge base with the PR's base branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Report coverage
        run: just coverage --cov-report="markdown-append:${GITHUB_STEP_SUMMARY}"

      - name: Report patch coverage
        if: github.event_name == 'pull_request'
        run: just diff-cover "origin/${BASE_REF}" --format "markdown:${GITHUB_STEP_SUMMARY}"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Tagging and releasing need a write-capable token, so they run in their own
  # job, only for pushes to master, and never alongside pull request code.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Tag and release version
        run: |
          VERSION="$(uv version --short)"
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}"
          fi
          # Checked separately so a rerun creates the release if an earlier run
          # pushed the tag but failed to create it.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --title "Release ${TAG}" --generate-notes
            echo "Created GitHub release ${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
