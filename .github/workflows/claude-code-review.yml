name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on PR comments (not plain issues) containing the trigger phrase,
    # and only for commenters trusted enough to grant write-scoped access to the token
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    env:
      # Strip secrets (including the OAuth token) from the environment of
      # commands Claude runs, as the PR it reviews may contain a prompt injection.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB isolates Claude's commands with
      # bubblewrap, which needs these packages and unprivileged user namespaces.
      # Without them Claude has no Bash at all. Mirrors the step the action runs
      # itself when allowed_non_write_users is set.
      - name: Install subprocess isolation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The action's default tools can't diff, only commit and push. No just:
          # the action puts its write-capable token in .git/config, where the
          # PR's own recipes and tests could read it. CI runs them instead, and
          # Claude can read the results.
          claude_args: '--allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
